services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: feederline
      POSTGRES_USER: feederline
      POSTGRES_PASSWORD: development
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - feederline_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feederline -d feederline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  feederline_postgres:
