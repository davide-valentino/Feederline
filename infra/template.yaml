AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Feederline direct same-region MediaConnect workflow pilot

Parameters:
  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager ARN containing DB_URI or a PostgreSQL URL string
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with routes to RDS and a Secrets Manager VPC endpoint
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowed to reach RDS and the Secrets Manager endpoint
  StateMachineName:
    Type: String
    Default: feederline-direct-media

Resources:
  ActivityRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DirectMediaConnectActivities
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Effect: Allow
                Action:
                  - mediaconnect:DescribeFlow
                  - mediaconnect:AddFlowOutputs
                  - mediaconnect:RemoveFlowOutput
                Resource: "*"

  DirectWorkflowActivities:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: app.workflows.direct_same_region.lambda_handler
      Runtime: python3.12
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt ActivityRole.Arn
      Architectures:
        - arm64
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref DatabaseSecretArn

  WorkflowLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/states/${StateMachineName}
      RetentionInDays: 30

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeWorkflowActivitiesAndLog
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DirectWorkflowActivities.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action: xray:PutTraceSegments
                Resource: "*"

  DirectMediaWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Ref StateMachineName
      Type: STANDARD
      Role: !GetAtt StateMachineRole.Arn
      DefinitionUri: direct_same_region.asl.json
      DefinitionSubstitutions:
        DirectWorkflowActivitiesArn: !GetAtt DirectWorkflowActivities.Arn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WorkflowLogs.Arn
        IncludeExecutionData: true
        Level: ALL
      Tracing:
        Enabled: true

Outputs:
  DirectMediaWorkflowArn:
    Description: Set as WORKFLOW_STATE_MACHINE_ARN for the outbox worker
    Value: !Ref DirectMediaWorkflow
  DirectWorkflowActivitiesArn:
    Value: !GetAtt DirectWorkflowActivities.Arn